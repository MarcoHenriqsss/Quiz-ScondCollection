        .choice {

            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;

        }

        .choice:hover,

            border-color: #b98494;

        /* ========================================

        function el(tag, cls, text) {
            const element = document.createElement(tag);

            if (cls) {
                element.className = cls;
            }

            if (text !== undefined) {
                element.textContent = text;
            }

            return element;
        }

        /* ========================================

        function render() {

            bar.style.width = (Math.min(step, 5) / 5 * 100) + "%";

            // Exibe as perguntas enquanto houver etapas.
            if (step < questions.length) {

                root.append(

                    el("h2", "question", question.title)
                );

                const list = el("div", "choices");

                question.options.forEach(([label, value]) => {

                    button.type = "button";
                    button.append(el("span", "", "→"));

                    button.onclick = () => {
                        answers[step] = value;
                        step++;
                        render();
                    };

                    list.append(button);

                root.append(list);

                // Permite retornar à pergunta anterior.

                    }))

                    .slice(0, 3);

                ranked.forEach((product, index) => {

                    card.append(
                        el(
                            "small",
                            "",
                            index === 0
                                ? "SUA MELHOR COMBINAÇÃO"

                        ),
                        el("h3", "", product.name),
                        el("p", "", product.description)
                    );

                    const link = el(
                        "a",
                        "cta",
                        "Quero saber mais sobre esse perfume ↗"
                    );

                    const numeroWhatsApp = "556293265596";

const mensagem =

link.href =

                    link.target = "_blank";

                    render();
                };

            }

        render();
